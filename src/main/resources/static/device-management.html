<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3344;
        }

        .btn-success {
            background: #2ed573;
            color: white;
        }

        .btn-success:hover {
            background: #26c966;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #888;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }

        .stat-card.online .value { color: #2ed573; }
        .stat-card.offline .value { color: #ff4757; }
        .stat-card.warning .value { color: #ffa502; }

        .main-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 0 16px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .search-box svg {
            color: #888;
        }

        .filter-group {
            display: flex;
            gap: 12px;
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .device-table {
            width: 100%;
            border-collapse: collapse;
        }

        .device-table th,
        .device-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .device-table th {
            color: #888;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
        }

        .device-table tbody tr {
            transition: background 0.2s;
        }

        .device-table tbody tr:hover {
            background: #f8f9fa;
        }

        .device-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-online {
            background: #d4edda;
            color: #155724;
        }

        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        .status-warning {
            background: #fff3cd;
            color: #856404;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn.edit {
            background: #e3f2fd;
            color: #1976d2;
        }

        .action-btn.edit:hover {
            background: #1976d2;
            color: white;
        }

        .action-btn.delete {
            background: #ffebee;
            color: #c62828;
        }

        .action-btn.delete:hover {
            background: #c62828;
            color: white;
        }

        .action-btn.view {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .action-btn.view:hover {
            background: #2e7d32;
            color: white;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            width: 40px;
            height: 40px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-btn:hover,
        .page-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }

            .device-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 设备管理系统</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshDevices()">
                    🔄 刷新
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    ➕ 添加设备
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>设备总数</h3>
                <div class="value" id="totalDevices">0</div>
            </div>
            <div class="stat-card online">
                <h3>在线设备</h3>
                <div class="value" id="onlineDevices">0</div>
            </div>
            <div class="stat-card offline">
                <h3>离线设备</h3>
                <div class="value" id="offlineDevices">0</div>
            </div>
            <div class="stat-card warning">
                <h3>告警设备</h3>
                <div class="value" id="warningDevices">0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="toolbar">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索设备名称、IP地址..." oninput="filterDevices()">
                </div>
                <div class="filter-group">
                    <select class="filter-select" id="statusFilter" onchange="filterDevices()">
                        <option value="">全部状态</option>
                        <option value="online">在线</option>
                        <option value="offline">离线</option>
                        <option value="warning">告警</option>
                    </select>
                    <select class="filter-select" id="typeFilter" onchange="filterDevices()">
                        <option value="">全部类型</option>
                        <option value="server">服务器</option>
                        <option value="router">路由器</option>
                        <option value="switch">交换机</option>
                        <option value="camera">摄像头</option>
                        <option value="sensor">传感器</option>
                    </select>
                </div>
            </div>

            <table class="device-table">
                <thead>
                    <tr>
                        <th>设备名称</th>
                        <th>IP地址</th>
                        <th>设备类型</th>
                        <th>状态</th>
                        <th>最后在线</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody">
                    <!-- 设备数据将通过JavaScript动态渲染 -->
                </tbody>
            </table>

            <div class="pagination" id="pagination">
                <!-- 分页按钮 -->
            </div>
        </div>
    </div>

    <!-- 添加/编辑设备模态框 -->
    <div class="modal-overlay" id="deviceModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">添加设备</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="deviceForm" onsubmit="saveDevice(event)">
                <input type="hidden" id="deviceId">
                <div class="form-group">
                    <label>设备名称 *</label>
                    <input type="text" id="deviceName" required placeholder="输入设备名称">
                </div>
                <div class="form-group">
                    <label>IP地址 *</label>
                    <input type="text" id="deviceIp" required placeholder="例如: 192.168.1.100">
                </div>
                <div class="form-group">
                    <label>设备类型 *</label>
                    <select id="deviceType" required>
                        <option value="">请选择</option>
                        <option value="server">服务器</option>
                        <option value="router">路由器</option>
                        <option value="switch">交换机</option>
                        <option value="camera">摄像头</option>
                        <option value="sensor">传感器</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>设备状态</label>
                    <select id="deviceStatus">
                        <option value="online">在线</option>
                        <option value="offline">离线</option>
                        <option value="warning">告警</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>位置</label>
                    <input type="text" id="deviceLocation" placeholder="例如: 机房A-01">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="deviceRemark" rows="3" placeholder="输入备注信息"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 设备详情模态框 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h2>设备详情</h2>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="deviceDetail">
                <!-- 详情内容 -->
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟设备数据
        let devices = [
            { id: 1, name: '主服务器-01', ip: '192.168.1.10', type: 'server', status: 'online', location: '机房A-01', lastOnline: '2024-01-15 10:30:00', remark: '核心业务服务器' },
            { id: 2, name: '核心路由器', ip: '192.168.1.1', type: 'router', status: 'online', location: '机房A-02', lastOnline: '2024-01-15 10:30:00', remark: '主网关' },
            { id: 3, name: '交换机-Floor1', ip: '192.168.1.20', type: 'switch', status: 'online', location: '1楼弱电间', lastOnline: '2024-01-15 10:30:00', remark: '' },
            { id: 4, name: '监控摄像头-大厅', ip: '192.168.1.100', type: 'camera', status: 'warning', location: '大厅入口', lastOnline: '2024-01-15 09:15:00', remark: '画面模糊，待检修' },
            { id: 5, name: '温度传感器-机房', ip: '192.168.1.150', type: 'sensor', status: 'online', location: '机房A', lastOnline: '2024-01-15 10:30:00', remark: '' },
            { id: 6, name: '备份服务器-01', ip: '192.168.1.11', type: 'server', status: 'offline', location: '机房B-01', lastOnline: '2024-01-14 18:00:00', remark: '计划维护中' },
            { id: 7, name: '交换机-Floor2', ip: '192.168.1.21', type: 'switch', status: 'online', location: '2楼弱电间', lastOnline: '2024-01-15 10:30:00', remark: '' },
            { id: 8, name: '监控摄像头-停车场', ip: '192.168.1.101', type: 'camera', status: 'online', location: '地下停车场', lastOnline: '2024-01-15 10:30:00', remark: '' },
        ];

        let currentPage = 1;
        const pageSize = 5;

        // 设备类型映射
        const typeMap = {
            server: '服务器',
            router: '路由器',
            switch: '交换机',
            camera: '摄像头',
            sensor: '传感器'
        };

        // 设备图标
        const typeIcons = {
            server: '🖥️',
            router: '📡',
            switch: '🔌',
            camera: '📷',
            sensor: '🌡️'
        };

        // 状态映射
        const statusMap = {
            online: { text: '在线', class: 'status-online' },
            offline: { text: '离线', class: 'status-offline' },
            warning: { text: '告警', class: 'status-warning' }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderDevices();
            updateStats();
        });

        // 获取过滤后的设备
        function getFilteredDevices() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            return devices.filter(device => {
                const matchSearch = device.name.toLowerCase().includes(search) || 
                                   device.ip.toLowerCase().includes(search);
                const matchStatus = !statusFilter || device.status === statusFilter;
                const matchType = !typeFilter || device.type === typeFilter;
                return matchSearch && matchStatus && matchType;
            });
        }

        // 渲染设备列表
        function renderDevices() {
            const tbody = document.getElementById('deviceTableBody');
            const filtered = getFilteredDevices();
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageDevices = filtered.slice(start, end);

            if (pageDevices.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                                <p>暂无设备数据</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = pageDevices.map(device => `
                <tr>
                    <td>
                        <div class="device-name">
                            <div class="device-icon">${typeIcons[device.type] || '📱'}</div>
                            <div>
                                <div style="font-weight: 500;">${device.name}</div>
                                <div style="font-size: 12px; color: #888;">${device.location || '-'}</div>
                            </div>
                        </div>
                    </td>
                    <td><code style="background: #f5f5f5; padding: 4px 8px; border-radius: 4px;">${device.ip}</code></td>
                    <td>${typeMap[device.type] || device.type}</td>
                    <td><span class="status-badge ${statusMap[device.status].class}">${statusMap[device.status].text}</span></td>
                    <td style="color: #888; font-size: 13px;">${device.lastOnline}</td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn view" onclick="viewDevice(${device.id})" title="查看详情">👁️</button>
                            <button class="action-btn edit" onclick="editDevice(${device.id})" title="编辑">✏️</button>
                            <button class="action-btn delete" onclick="deleteDevice(${device.id})" title="删除">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(filtered.length);
        }

        // 渲染分页
        function renderPagination(total) {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(total / pageSize);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;

            pagination.innerHTML = html;
        }

        // 切换页面
        function changePage(page) {
            const filtered = getFilteredDevices();
            const totalPages = Math.ceil(filtered.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderDevices();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalDevices').textContent = devices.length;
            document.getElementById('onlineDevices').textContent = devices.filter(d => d.status === 'online').length;
            document.getElementById('offlineDevices').textContent = devices.filter(d => d.status === 'offline').length;
            document.getElementById('warningDevices').textContent = devices.filter(d => d.status === 'warning').length;
        }

        // 过滤设备
        function filterDevices() {
            currentPage = 1;
            renderDevices();
        }

        // 刷新
        function refreshDevices() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('typeFilter').value = '';
            currentPage = 1;
            renderDevices();
            updateStats();
            alert('刷新成功！');
        }

        // 打开添加模态框
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加设备';
            document.getElementById('deviceForm').reset();
            document.getElementById('deviceId').value = '';
            document.getElementById('deviceModal').classList.add('active');
        }

        // 编辑设备
        function editDevice(id) {
            const device = devices.find(d => d.id === id);
            if (!device) return;

            document.getElementById('modalTitle').textContent = '编辑设备';
            document.getElementById('deviceId').value = device.id;
            document.getElementById('deviceName').value = device.name;
            document.getElementById('deviceIp').value = device.ip;
            document.getElementById('deviceType').value = device.type;
            document.getElementById('deviceStatus').value = device.status;
            document.getElementById('deviceLocation').value = device.location || '';
            document.getElementById('deviceRemark').value = device.remark || '';
            document.getElementById('deviceModal').classList.add('active');
        }

        // 查看设备详情
        function viewDevice(id) {
            const device = devices.find(d => d.id === id);
            if (!device) return;

            document.getElementById('deviceDetail').innerHTML = `
                <div style="padding: 16px; background: #f8f9fa; border-radius: 8px;">
                    <p style="margin-bottom: 12px;"><strong>设备名称：</strong>${device.name}</p>
                    <p style="margin-bottom: 12px;"><strong>IP地址：</strong>${device.ip}</p>
                    <p style="margin-bottom: 12px;"><strong>设备类型：</strong>${typeMap[device.type]}</p>
                    <p style="margin-bottom: 12px;"><strong>状态：</strong><span class="status-badge ${statusMap[device.status].class}">${statusMap[device.status].text}</span></p>
                    <p style="margin-bottom: 12px;"><strong>位置：</strong>${device.location || '-'}</p>
                    <p style="margin-bottom: 12px;"><strong>最后在线：</strong>${device.lastOnline}</p>
                    <p><strong>备注：</strong>${device.remark || '-'}</p>
                </div>
            `;
            document.getElementById('detailModal').classList.add('active');
        }

        // 删除设备
        function deleteDevice(id) {
            if (!confirm('确定要删除这个设备吗？')) return;
            devices = devices.filter(d => d.id !== id);
            renderDevices();
            updateStats();
        }

        // 保存设备
        function saveDevice(e) {
            e.preventDefault();

            const id = document.getElementById('deviceId').value;
            const deviceData = {
                name: document.getElementById('deviceName').value,
                ip: document.getElementById('deviceIp').value,
                type: document.getElementById('deviceType').value,
                status: document.getElementById('deviceStatus').value,
                location: document.getElementById('deviceLocation').value,
                remark: document.getElementById('deviceRemark').value,
                lastOnline: new Date().toLocaleString('zh-CN').replace(/\//g, '-')
            };

            if (id) {
                // 编辑
                const index = devices.findIndex(d => d.id === parseInt(id));
                if (index !== -1) {
                    devices[index] = { ...devices[index], ...deviceData };
                }
            } else {
                // 新增
                deviceData.id = Math.max(...devices.map(d => d.id), 0) + 1;
                devices.push(deviceData);
            }

            closeModal();
            renderDevices();
            updateStats();
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('deviceModal').classList.remove('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // 点击遮罩关闭
        document.getElementById('deviceModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });
    </script>
</body>
</html>
