# 主配置文件 - 通用配置
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  application:
    name: AI-world
  
  # 通用配置
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # MVC 异步请求超时（AI 接口使用 CompletableFuture，默认超时较短会触发 AsyncRequestTimeoutException）
  mvc:
    async:
      request-timeout: 600s

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.baomidou: WARN
    org.apache.ibatis: WARN

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

ai:
  web-search:
    fallback-to-chat-without-search: true
    searxng:
      enabled: ${WEB_SEARCH_ENABLED:true}
      base-url: ${SEARXNG_BASE_URL:http://127.0.0.1:8080}
      timeout-ms: ${SEARXNG_TIMEOUT_MS:8000}
      max-results: ${SEARXNG_MAX_RESULTS:8}
      fetch-top-n: ${SEARXNG_FETCH_TOP_N:3}
      language: ${SEARXNG_LANGUAGE:zh-CN}
      safe-search: ${SEARXNG_SAFE_SEARCH:1}
