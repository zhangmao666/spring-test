# 主配置文件 - 通用配置
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  application:
    name: AI-world
  
  # 通用配置
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # MVC 异步请求超时（AI 接口使用 CompletableFuture，默认超时较短会触发 AsyncRequestTimeoutException）
  mvc:
    async:
      request-timeout: 600s

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
