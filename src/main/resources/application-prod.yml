# 生产环境配置
spring:
  application:
    name: spring-boot-test

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: SpringBootTestHikariCP
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        cache:
          use_second_level_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=3600s

server:
  port: ${SERVER_PORT:8777}
  servlet:
    context-path: /api
  shutdown: graceful
  tomcat:
    connection-timeout: 20000
    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    max-connections: 20000

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

api:
  client:
    token:
      expiration: ${API_CLIENT_TOKEN_EXPIRATION:7200000}
      default-scopes: ${API_CLIENT_DEFAULT_SCOPES:read,write}

logging:
  level:
    root: INFO
    com.example.springboottest: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: /var/log/spring-boot-test/application.log
    max-size: 50MB
    max-history: 60
    total-size-cap: 5GB

ai:
  openai:
    api-key: ${OPENAI_API_KEY}
    api-url: ${OPENAI_API_URL:https://api.gpt.ge/}
    model: ${OPENAI_MODEL:gpt-3.5-turbo}
    max-tokens: 1000
    temperature: 0.7

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: ${MINIO_SECURE:true}

di:
  url: ${DI_URLS}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

http:
  connect-timeout: 30
  read-timeout: 60
  write-timeout: 60
  max-idle-connections: 20
  keep-alive-duration: 300
  enable-logging: false
  max-retries: 3
