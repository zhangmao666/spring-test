# 开发环境配置
spring:
  application:
    name: spring-boot-test

  ai:
    openai:
      base-url: https://yunwu.ai
      api-key: ${OPENAI_API_KEY:sk-1iUHwOkNCfS3ubV9bB9JbInhyRD6RtARzEHxjjlGGUugMOCV}
      chat:
        options:
          model: gpt-5.2-chat-latest
          temperature: 0.7
          max-tokens: 1024

  datasource:
    url: jdbc:mysql://${DB_HOST:118.24.128.221}:${DB_PORT:3306}/${DB_NAME:spring_boot_test}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:cxzx!@#123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: SpringBootTestHikariCP

  mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
      banner: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=600s

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:1097765371@qq.com}
    password: ${MAIL_PASSWORD:rqjlkqmvltrhifhe}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.qq.com
    default-encoding: UTF-8

server:
  port: 8879
  servlet:
    context-path: /api
  shutdown: graceful
  tomcat:
    connection-timeout: 20000
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 11000

jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: 86400000

api:
  client:
    token:
      expiration: 7200000
      default-scopes: read,write

logging:
  level:
    root: INFO
    com.example.springboottest: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.openai: DEBUG
    org.springframework.ai.tool: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/spring-boot-test.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-1iUHwOkNCfS3ubV9bB9JbInhyRD6RtARzEHxjjlGGUugMOCV}
    api-url: https://yunwu.ai/v1/chat/completions
    model: deepseek-v3.2
    thinking-model: gemini-2.5-flash-all
    search-model: gemini-2.5-flash-all
    max-tokens: 1024
    temperature: 0.7

agent:
  default-model: default
  skills:
    directories:
      - classpath:skills/
    custom-dir: ./custom-skills
    enable-shell-tools: true
    enable-fs-tools: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://222.173.143.39:29103}
  access-key: ${MINIO_ACCESS_KEY:RvqM1kk8xaDPJNoE}
  secret-key: ${MINIO_SECRET_KEY:ObLEive6MAlFj9cG}
  bucket-name: ${MINIO_BUCKET_NAME:ObLEive6MAlFj9cG}
  secure: false

di:
  url:
    - http://192.168.1.1:8080
    - http://192.168.1.2:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

http:
  connect-timeout: 30
  read-timeout: 60
  write-timeout: 60
  max-idle-connections: 10
  keep-alive-duration: 300
  enable-logging: true
  max-retries: 3

stock:
  data:
    source: sina
    fetch-interval: 5
    trading-hours:
      start: "09:30"
      end: "15:00"
    schedule-enabled: true

  websocket:
    allowed-origins: "*"
    message-size-limit: 128

  analysis:
    interval: 15
    provider: qwen
    history-window: 7
    enabled: true

payment:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify-url: ${ALIPAY_NOTIFY_URL:http://your-domain/api/payment/notify/alipay}
    return-url: ${ALIPAY_RETURN_URL:http://your-domain/payment/result}

  wechat:
    merchant-id: ${WECHAT_MERCHANT_ID:}
    private-key: ${WECHAT_PRIVATE_KEY:}
    merchant-serial-number: ${WECHAT_MERCHANT_SERIAL_NUMBER:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    app-id: ${WECHAT_APP_ID:}
    notify-url: ${WECHAT_NOTIFY_URL:http://your-domain/api/payment/notify/wechat}
